<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Galactic Hearth Ledger | Cosmic Hearth Games</title><style>:root{font-family:Georgia,serif;color:#f5e8cc;background:#231225}body{margin:0;background:radial-gradient(circle at top,#50315a,#231225 65%);min-height:100vh}main{max-width:920px;margin:auto;padding:35px 20px}h1,h2{color:#edc765}h1{margin-bottom:4px}p{line-height:1.5}.sub{color:#ddc9ad}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{cursor:pointer;border:1px solid #cba449;background:#50315a;color:#f8e6c4;border-radius:7px;padding:10px 16px}button.active{background:#e9c56a;color:#28172c}.panel{background:#f3e7d0;color:#2b1b2d;border-radius:12px;padding:24px;min-height:250px}label{display:block;margin:13px 0 5px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b7a58b;border-radius:6px;background:white;font-size:16px}input[type=checkbox]{width:auto}.stage{border:1px solid #c5af84;border-radius:8px;padding:13px;margin:14px 0;background:#fff9ed}.stage h3{margin:0 0 8px}.choice{display:flex;align-items:flex-start;gap:10px;margin:8px 0}.choice label{margin:0;font-weight:normal}.btn{background:#693a49;color:white;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:left;border-bottom:1px solid #d7c5a6}.muted{color:#725f60}.notice{padding:12px;border-left:4px solid #b18b29;background:#fff7e4;margin-bottom:16px}.success{color:#23603a}.error{color:#a12b32}@media(max-width:600px){.panel{padding:16px}table{font-size:13px}}.home-hero{background:linear-gradient(135deg,#33203b,#65465c);color:#f7ecd6;border-radius:12px;padding:28px;margin-bottom:18px}.home-hero h2{color:#f3ce75;font-size:clamp(25px,4vw,38px);margin:10px 0}.home-hero p{max-width:700px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:bold;color:#aa7e31}.home-hero .eyebrow{color:#e9c56a}.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 30px}.home-stats div{background:#fff9ed;border:1px solid #d5be8e;border-radius:9px;padding:14px}.home-stats strong{display:block;font-size:22px;color:#513058}.home-stats span{font-size:12px;color:#715d58}.home-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.home-stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.home-stages .stage{margin:0}.army-points{font-size:27px;font-weight:bold;color:#693a49}.rules li{padding:6px 0}.award-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:10px 0}.home-hero button{background:#e9c56a;color:#28172c}.home-hero button+button{background:transparent;color:#f6e7c9}@media(max-width:650px){.home-stats{grid-template-columns:repeat(2,1fr)}.home-columns,.home-stages,.award-grid{grid-template-columns:1fr}}a{color:#6a396e}.longshanks-cta{display:inline-flex;align-items:center;border:1px solid #e9c56a;border-radius:7px;padding:10px 16px;color:#f6e7c9;text-decoration:none;font-size:14px;font-weight:bold}.longshanks-cta:hover{background:#6b4b70}</style><style id="galactic-theme">
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;700;800&display=swap');
:root{font-family:'Rajdhani',Arial,sans-serif;color:#f4e9cb;background:#080e19}
body{background:radial-gradient(ellipse at 50% -15%,#233a59 0%,#0b1728 45%,#070b13 85%);color:#f3e8cc}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#fff 0.8px,transparent 1px),radial-gradient(#b9d5ff .7px,transparent 1px);background-size:97px 109px,157px 173px;background-position:17px 31px,65px 78px}
main{position:relative;max-width:1060px}
header{border-bottom:1px solid #8c723d;padding:12px 0 18px}
header h1{font-family:'Orbitron',sans-serif;font-size:clamp(21px,4vw,35px);letter-spacing:.09em;color:#f2c85d;text-shadow:0 0 22px #d4a54255}
.ledger-label{color:#f8f4e9}
header .sub{font-family:'Rajdhani',sans-serif;letter-spacing:.06em;color:#c6d3e4}
nav button{font-family:'Rajdhani',sans-serif;text-transform:uppercase;font-size:14px;letter-spacing:.09em;font-weight:700;background:#14243a;color:#e7d9b5;border:1px solid #5e7794;border-radius:4px}
nav button:hover{border-color:#f2c85d;background:#233b55}
nav button.active{background:#f2c85d;color:#101927;border-color:#f2c85d}
.panel{background:#101d30;color:#e8eaf0;border:1px solid #405a78;box-shadow:0 16px 45px #0007}
.panel h2,.panel h3{font-family:'Orbitron',sans-serif;color:#f2c85d;letter-spacing:.025em}
.home-hero{background:linear-gradient(105deg,#0a1728ee,#21334bee),radial-gradient(circle at 80% 20%,#d2a44255,transparent 45%);border:1px solid #a88a48;border-left:5px solid #e9bd4f;border-radius:5px}
.home-hero h2{font-family:'Orbitron',sans-serif;font-size:clamp(24px,4vw,38px);line-height:1.3;color:#f4cf69}
.home-hero .eyebrow{color:#c6d8f5;letter-spacing:.18em}
.home-stats div,.stage{background:#182b42;border:1px solid #46617e;border-radius:5px;color:#e9eef4}

button,.btn{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.03em;background:#25435e;color:#f7e8c3;border:1px solid #8195a9}
button:hover,.btn:hover{filter:brightness(1.18)}
.home-hero button{background:#e9c56a;color:#111d30}
.home-hero button+button{background:#1c344b;color:#f3e8cc}
label{color:#e6d7b3}
input,select,textarea{background:#f6f8fc;color:#172133}
th,td{border-bottom:1px solid #405a78}
a{color:#f4d075}
.notice{background:#213a51;border-left-color:#f2c85d;color:#e7edf4}
.longshanks-cta{border-color:#f2c85d;color:#f2d783}
@media(max-width:600px){main{padding:18px 12px}nav{gap:5px}nav button{padding:9px 10px;font-size:12px}}
</style></head><body><main><header><h1>GALACTIC HEARTH <span class="ledger-label">LEDGER</span></h1><p class="sub">Cosmic Hearth Games · Star Wars: Legion Escalation League</p><p class="sub">Pineville Thursdays · Belmont Sundays · Nov 12 – Jan 10</p></header><nav id="tabs"><button data-tab="home" class="active">League Home</button><button data-tab="bounties">Bounties</button><button data-tab="submit">Submit Points</button><button data-tab="standings">Standings</button><button data-tab="review">Organizer Review</button></nav><section class="panel" id="view"></section></main><script>
const stages=[
{title:"Sparks of Rebellion",points:600,dates:"Nov 12–25",b:[["first-blood","Opening Salvo","Defeat an enemy unit"],["sector","Capture the Command Post","Score at least one mission objective"],["enemy","A Galaxy of Rivals","Play against two different opponents"]]},
{title:"The Clone Wars",points:700,dates:"Nov 26–Dec 9",b:[["reinforcements","Send in the Reinforcements","Field a unit you have not used earlier in the league"],["hold","Defend the Outpost","Score a mission objective while defending or contesting it"],["rivalry","An Unexpected Enemy","Play against an opponent you have not faced in the league"]]},
{title:"The Outer Rim Campaign",points:850,dates:"Dec 10–23",b:[["strike","Strike at the Leadership","Defeat an enemy commander or operative"],["tactics","Victory Through Strategy","Win by scoring more mission points"],["veteran","Veteran of the Outer Rim","Complete both official games in this stage"]]},
{title:"Battle for the Galaxy",points:1000,dates:"Dec 24–Jan 6",b:[["deployment","All Wings Report In","Field a legal 1,000-point army"],["galactic-veteran","Veteran of a Thousand Battles","Complete six official games over the season"],["push","One Last Hope","Score mission points in the final round"]]}];
const view=document.querySelector("#view");let tab="home";let cached=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="home")homeView();if(tab==="bounties")view.innerHTML='<h2>Stage Bounties</h2><p>Each bounty is worth 2 points, once per stage. Honor system with organizer review.</p>'+stages.map((s,i)=>'<div class="stage"><h3>Stage '+(i+1)+': '+s.title+'</h3><p class="muted">'+s.dates+' · '+s.points+' points</p>'+s.b.map(b=>'<p><strong>'+b[1]+' (+2)</strong> — '+b[2]+'</p>').join('')+'</div>').join('');if(tab==="submit")submitView();if(tab==="standings")loadStandings();if(tab==="review")reviewView()}
function homeView(){view.innerHTML=`
<div class="home-hero"><div class="eyebrow">A LONG TIME AGO, AT A HEARTH NOT SO FAR AWAY...</div><h2>STAR WARS: LEGION<br>ESCALATION LEAGUE</h2><p>Build your army. Learn the game. Forge rivalries. Whether you're brand new to Star Wars: Legion or a veteran commander, this is an eight-week journey from your first skirmish to a full-scale battle.</p><div class="home-actions"><button onclick="tab='submit';render()">Submit League Points</button><button onclick="tab='bounties';render()">Explore Bounties</button><a class="longshanks-cta" href="https://legion.longshanks.org/event/39225/" target="_blank" rel="noopener noreferrer">View Longshanks Event ↗</a></div></div>
<div class="home-stats"><div><strong>8 weeks</strong><span>Nov 12, 2026 – Jan 6, 2027</span></div><div><strong>$20</strong><span>League entry</span></div><div><strong>2 stores</strong><span>One shared league</span></div><div><strong>Jan 10</strong><span>Finale at Belmont</span></div></div>
<h2>Where & when to play</h2><div class="home-columns"><div class="stage"><h3>📍 Pineville</h3><p><strong>Thursdays</strong> · Weekly Legion league play</p></div><div class="stage"><h3>📍 Belmont</h3><p><strong>Sundays at 12:30 PM</strong> · Weekly Legion league play</p></div></div><p>Play at either location. Everyone competes in one combined league, and all Legion factions are welcome. Holiday scheduling during the final stage is flexible.</p>
<h2>Escalation schedule</h2><p>Grow your army as the campaign progresses. Each stage lasts two weeks.</p><div class="home-stages">${stages.map((s,i)=>'<div class="stage"><div class="eyebrow">STAGE '+(i+1)+'</div><h3>'+s.title+'</h3><div class="army-points">'+s.points+' pts</div><p>'+s.dates+', '+(i<2?'2026':i===2?'2026':'2026–27')+'</p><p class="muted">Three optional stage bounties · +2 points each</p></div>').join('')}</div>
<h2>How the league works</h2><div class="stage"><ol class="rules"><li><strong>Play:</strong> Up to one official scoring game per player each week. You can enjoy additional casual games.</li><li><strong>Record your match:</strong> Use <a href="https://legion.longshanks.org/event/39225/" target="_blank" rel="noopener noreferrer">Longshanks</a> for official battle results and competitive standings.</li><li><strong>Claim league points:</strong> Submit participation achievements and stage bounties here in the Galactic Hearth Ledger.</li><li><strong>Honor system:</strong> You report what you earned; organizers review submissions. Duplicate claims do not earn extra points.</li><li><strong>Stay in the race:</strong> Your <strong>best six of eight weekly scores</strong> count toward the overall league standings, so missing a week doesn't end your campaign.</li></ol></div>
<h2>League scoring</h2><div class="home-columns"><div class="stage"><h3>Weekly achievements</h3><table><tbody><tr><td>Complete an official weekly game</td><td><strong>+5</strong></td></tr><tr><td>Win your official game</td><td><strong>+3</strong></td></tr><tr><td>Draw your official game</td><td><strong>+1</strong></td></tr><tr><td>Face a new opponent</td><td><strong>+1</strong></td></tr><tr><td>Play at both stores during a stage</td><td><strong>+2</strong></td></tr></tbody></table></div><div class="stage"><h3>Stage bounties</h3><p>Each stage offers three themed challenges, worth <strong>+2 points each</strong>. Claim each bounty once per stage.</p><p>Bounties reward exploring the game, trying new units, playing different opponents, and developing your army—not just winning.</p><button onclick="tab='bounties';render()">See all 12 bounties</button></div></div>
<div class="stage"><h3>Track your campaign</h3><p><strong>Community league standings:</strong> Participation and bounties in this app; best six weeks count.</p><p><strong>Official match results:</strong> Competitive game results tracked separately in Longshanks (3 points for a win, 1 for a draw, 0 for a loss).</p></div>
<h2>Finale & recognition</h2><div class="stage"><h3>Sunday, January 10, 2027 · Belmont</h3><p>Celebrate the campaign with a league finale and recognition of our commanders.</p><div class="award-grid"><span>🏆 Overall League Champion</span><span>🎨 Painting Award</span><span>🌟 Rookie Award</span></div><p class="muted">Specific prize details and finale format will be announced by organizers.</p></div>
<div class="notice"><strong>New to Legion?</strong> You're welcome here. Bring the faction you enjoy, ask questions, and grow your army at your own pace. Our goal is to build a fun, supportive Legion community across both Hearth locations.</div><p style="text-align:center;font-style:italic">Gather. Play. Unwind.</p>`;}
function submitView(){view.innerHTML='<h2>Submit League Points</h2><div class="notice">Honor-system claims are subject to organizer review. Longshanks remains the official battle record.</div><form id="submission"><label>Player name</label><input name="player" required maxlength="80" autocomplete="name"><label>Stage</label><select name="stage" id="stage">'+stages.map((s,i)=>'<option value="'+(i+1)+'">Stage '+(i+1)+' — '+s.title+'</option>').join('')+'</select><label>League week (1–8)</label><select name="week">'+Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'">Week '+(i+1)+'</option>').join('')+'</select><label>Location</label><select name="location"><option>Pineville</option><option>Belmont</option></select><label>Longshanks match link (for game claims)</label><input name="matchUrl" type="url" placeholder="https://..."><div id="achievements"></div><label>Optional notes</label><textarea name="notes" rows="3" maxlength="500"></textarea><button class="btn" type="submit">Send for Organizer Review</button><p id="message" role="status"></p></form>';document.querySelector("#stage").addEventListener("change",drawAchievements);drawAchievements();document.querySelector("#submission").addEventListener("submit",submit)}
function drawAchievements(){const s=Number(document.querySelector("#stage").value);document.querySelector("#achievements").innerHTML='<h3>Achievements</h3>'+[['game','Official game played (+5)'],['win','Official game won (+3)'],['draw','Official game drawn (+1)'],['new-opponent','New opponent (+1)'],['both-stores','Both locations during stage (+2)']].map(x=>'<div class="choice"><input type="checkbox" name="achievement" value="'+x[0]+'" id="'+x[0]+'"><label for="'+x[0]+'">'+x[1]+'</label></div>').join('')+'<h3>Stage '+s+' Bounties</h3>'+stages[s-1].b.map(b=>'<div class="choice"><input type="checkbox" name="bounty" value="'+b[0]+'" id="'+b[0]+'"><label for="'+b[0]+'"><strong>'+b[1]+' (+2)</strong> — '+b[2]+'</label></div>').join('')}
async function submit(e){e.preventDefault();const f=e.target;const msg=document.querySelector("#message");const data=new FormData(f);const payload={player:data.get("player").trim(),stage:Number(data.get("stage")),week:Number(data.get("week")),location:data.get("location"),matchUrl:data.get("matchUrl"),notes:data.get("notes"),achievements:data.getAll("achievement"),bounties:data.getAll("bounty")};if(!payload.achievements.length&&!payload.bounties.length){msg.textContent="Choose at least one achievement or bounty.";return}msg.textContent="Submitting…";try{const r=await fetch("/api/submissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||"Submission failed");msg.className="success";msg.textContent="Submitted for organizer review. Reference: "+j.id;f.reset();drawAchievements()}catch(e){msg.className="error";msg.textContent=e.message}}
async function loadStandings(){view.innerHTML='<h2>Galactic League Standings</h2><p class="muted">Approved points only. Best six weekly totals count toward the season score.</p><p>Loading…</p>';try{const r=await fetch("/api/standings");const j=await r.json();if(!r.ok)throw Error(j.error);view.innerHTML='<h2>Galactic League Standings</h2><p class="muted">Approved claims · Best 6 of 8 weeks</p><table><thead><tr><th>Rank</th><th>Commander</th><th>Points</th></tr></thead><tbody>'+j.players.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.total+'</td></tr>').join('')+'</tbody></table>'+(j.players.length?'':'<p>No approved submissions yet.</p>')}catch(e){view.innerHTML='<h2>Standings</h2><p class="error">'+esc(e.message)+'</p>'}}
function reviewView(){view.innerHTML='<h2>Organizer Review</h2><p>For James and Rob. Enter your organizer review key to view and review claims.</p><label>Organizer key</label><input type="password" id="key"><button class="btn" id="load">Load Pending Claims</button><div id="queue"></div>';document.querySelector("#load").onclick=loadQueue}
async function loadQueue(){const key=document.querySelector("#key").value;const q=document.querySelector("#queue");q.textContent="Loading…";try{const r=await fetch("/api/submissions",{headers:{"Authorization":"Bearer "+key}});const j=await r.json();if(!r.ok)throw Error(j.error);cached=j.submissions.filter(x=>x.status==="pending");q.innerHTML=cached.length?cached.map(x=>'<div class="stage"><strong>'+esc(x.player)+'</strong> · Week '+x.week+' · Stage '+x.stage+'<p>'+esc([...x.achievements,...x.bounties].join(", "))+'</p><p class="muted">'+esc(x.notes||"")+'</p><button data-id="'+esc(x.id)+'" data-action="approved">Approve</button> <button data-id="'+esc(x.id)+'" data-action="rejected">Reject</button></div>').join(''):'<p>No pending submissions.</p>';q.querySelectorAll("button").forEach(b=>b.onclick=()=>decide(b.dataset.id,b.dataset.action,key))}catch(e){q.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function decide(id,status,key){try{const r=await fetch("/api/submissions",{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({id,status})});const j=await r.json();if(!r.ok)throw Error(j.error);loadQueue()}catch(e){alert(e.message)}}
document.querySelector("#tabs").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;render()}};render();
</script></body></html>
