<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Galactic Hearth Ledger | Cosmic Hearth Games</title><style>:root{font-family:Georgia,serif;color:#f5e8cc;background:#231225}body{margin:0;background:radial-gradient(circle at top,#50315a,#231225 65%);min-height:100vh}main{max-width:920px;margin:auto;padding:35px 20px}h1,h2{color:#edc765}h1{margin-bottom:4px}p{line-height:1.5}.sub{color:#ddc9ad}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{cursor:pointer;border:1px solid #cba449;background:#50315a;color:#f8e6c4;border-radius:7px;padding:10px 16px}button.active{background:#e9c56a;color:#28172c}.panel{background:#f3e7d0;color:#2b1b2d;border-radius:12px;padding:24px;min-height:250px}label{display:block;margin:13px 0 5px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b7a58b;border-radius:6px;background:white;font-size:16px}input[type=checkbox]{width:auto}.stage{border:1px solid #c5af84;border-radius:8px;padding:13px;margin:14px 0;background:#fff9ed}.stage h3{margin:0 0 8px}.choice{display:flex;align-items:flex-start;gap:10px;margin:8px 0}.choice label{margin:0;font-weight:normal}.btn{background:#693a49;color:white;margin-top:15px}table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:left;border-bottom:1px solid #d7c5a6}.muted{color:#725f60}.notice{padding:12px;border-left:4px solid #b18b29;background:#fff7e4;margin-bottom:16px}.success{color:#23603a}.error{color:#a12b32}@media(max-width:600px){.panel{padding:16px}table{font-size:13px}}</style></head><body><main><header><h1>✦ Galactic Hearth Ledger</h1><p class="sub">Cosmic Hearth Games · Star Wars: Legion Escalation League</p><p class="sub">Pineville Thursdays · Belmont Sundays · Nov 12 – Jan 10</p></header><nav id="tabs"><button data-tab="bounties" class="active">Bounties</button><button data-tab="submit">Submit Points</button><button data-tab="standings">Standings</button><button data-tab="review">Organizer Review</button></nav><section class="panel" id="view"></section></main><script>
const stages=[
{title:"First Contact",points:600,dates:"Nov 12–25",b:[["first-blood","First Blood","Defeat an enemy unit"],["sector","Secure the Sector","Score at least one mission objective"],["enemy","Know Your Enemy","Play against two different opponents"]]},
{title:"Reinforcements",points:700,dates:"Nov 26–Dec 9",b:[["reinforcements","Fresh Reinforcements","Field a unit you have not used earlier in the league"],["hold","Hold the Line","Score a mission objective while defending or contesting it"],["rivalry","New Rivalry","Play against an opponent you have not faced in the league"]]},
{title:"Galactic Offensive",points:850,dates:"Dec 10–23",b:[["strike","Decisive Strike","Defeat an enemy commander or operative"],["tactics","Tactical Mastery","Win by scoring more mission points"],["veteran","Veteran Commander","Complete both official games in this stage"]]},
{title:"Total War",points:1000,dates:"Dec 24–Jan 6",b:[["deployment","Full Deployment","Field a legal 1,000-point army"],["galactic-veteran","Galactic Veteran","Complete six official games over the season"],["push","The Final Push","Score mission points in the final round"]]}];
const view=document.querySelector("#view");let tab="bounties";let cached=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="bounties")view.innerHTML='<h2>Stage Bounties</h2><p>Each bounty is worth 2 points, once per stage. Honor system with organizer review.</p>'+stages.map((s,i)=>'<div class="stage"><h3>Stage '+(i+1)+': '+s.title+'</h3><p class="muted">'+s.dates+' · '+s.points+' points</p>'+s.b.map(b=>'<p><strong>'+b[1]+' (+2)</strong> — '+b[2]+'</p>').join('')+'</div>').join('');if(tab==="submit")submitView();if(tab==="standings")loadStandings();if(tab==="review")reviewView()}
function submitView(){view.innerHTML='<h2>Submit League Points</h2><div class="notice">Honor-system claims are subject to organizer review. Longshanks remains the official battle record.</div><form id="submission"><label>Player name</label><input name="player" required maxlength="80" autocomplete="name"><label>Stage</label><select name="stage" id="stage">'+stages.map((s,i)=>'<option value="'+(i+1)+'">Stage '+(i+1)+' — '+s.title+'</option>').join('')+'</select><label>League week (1–8)</label><select name="week">'+Array.from({length:8},(_,i)=>'<option value="'+(i+1)+'">Week '+(i+1)+'</option>').join('')+'</select><label>Location</label><select name="location"><option>Pineville</option><option>Belmont</option></select><label>Longshanks match link (for game claims)</label><input name="matchUrl" type="url" placeholder="https://..."><div id="achievements"></div><label>Optional notes</label><textarea name="notes" rows="3" maxlength="500"></textarea><button class="btn" type="submit">Send for Organizer Review</button><p id="message" role="status"></p></form>';document.querySelector("#stage").addEventListener("change",drawAchievements);drawAchievements();document.querySelector("#submission").addEventListener("submit",submit)}
function drawAchievements(){const s=Number(document.querySelector("#stage").value);document.querySelector("#achievements").innerHTML='<h3>Achievements</h3>'+[['game','Official game played (+5)'],['win','Official game won (+3)'],['draw','Official game drawn (+1)'],['new-opponent','New opponent (+1)'],['painting','Painting milestone (+2)'],['both-stores','Both locations during stage (+2)']].map(x=>'<div class="choice"><input type="checkbox" name="achievement" value="'+x[0]+'" id="'+x[0]+'"><label for="'+x[0]+'">'+x[1]+'</label></div>').join('')+'<h3>Stage '+s+' Bounties</h3>'+stages[s-1].b.map(b=>'<div class="choice"><input type="checkbox" name="bounty" value="'+b[0]+'" id="'+b[0]+'"><label for="'+b[0]+'"><strong>'+b[1]+' (+2)</strong> — '+b[2]+'</label></div>').join('')}
async function submit(e){e.preventDefault();const f=e.target;const msg=document.querySelector("#message");const data=new FormData(f);const payload={player:data.get("player").trim(),stage:Number(data.get("stage")),week:Number(data.get("week")),location:data.get("location"),matchUrl:data.get("matchUrl"),notes:data.get("notes"),achievements:data.getAll("achievement"),bounties:data.getAll("bounty")};if(!payload.achievements.length&&!payload.bounties.length){msg.textContent="Choose at least one achievement or bounty.";return}msg.textContent="Submitting…";try{const r=await fetch("/api/submissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||"Submission failed");msg.className="success";msg.textContent="Submitted for organizer review. Reference: "+j.id;f.reset();drawAchievements()}catch(e){msg.className="error";msg.textContent=e.message}}
async function loadStandings(){view.innerHTML='<h2>Galactic League Standings</h2><p class="muted">Approved points only. Best six weekly totals count toward the season score.</p><p>Loading…</p>';try{const r=await fetch("/api/standings");const j=await r.json();if(!r.ok)throw Error(j.error);view.innerHTML='<h2>Galactic League Standings</h2><p class="muted">Approved claims · Best 6 of 8 weeks</p><table><thead><tr><th>Rank</th><th>Commander</th><th>Points</th></tr></thead><tbody>'+j.players.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.total+'</td></tr>').join('')+'</tbody></table>'+(j.players.length?'':'<p>No approved submissions yet.</p>')}catch(e){view.innerHTML='<h2>Standings</h2><p class="error">'+esc(e.message)+'</p>'}}
function reviewView(){view.innerHTML='<h2>Organizer Review</h2><p>For James and Rob. Enter your organizer review key to view and review claims.</p><label>Organizer key</label><input type="password" id="key"><button class="btn" id="load">Load Pending Claims</button><div id="queue"></div>';document.querySelector("#load").onclick=loadQueue}
async function loadQueue(){const key=document.querySelector("#key").value;const q=document.querySelector("#queue");q.textContent="Loading…";try{const r=await fetch("/api/submissions",{headers:{"Authorization":"Bearer "+key}});const j=await r.json();if(!r.ok)throw Error(j.error);cached=j.submissions.filter(x=>x.status==="pending");q.innerHTML=cached.length?cached.map(x=>'<div class="stage"><strong>'+esc(x.player)+'</strong> · Week '+x.week+' · Stage '+x.stage+'<p>'+esc([...x.achievements,...x.bounties].join(", "))+'</p><p class="muted">'+esc(x.notes||"")+'</p><button data-id="'+esc(x.id)+'" data-action="approved">Approve</button> <button data-id="'+esc(x.id)+'" data-action="rejected">Reject</button></div>').join(''):'<p>No pending submissions.</p>';q.querySelectorAll("button").forEach(b=>b.onclick=()=>decide(b.dataset.id,b.dataset.action,key))}catch(e){q.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function decide(id,status,key){try{const r=await fetch("/api/submissions",{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({id,status})});const j=await r.json();if(!r.ok)throw Error(j.error);loadQueue()}catch(e){alert(e.message)}}
document.querySelector("#tabs").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;render()}};render();
</script></body></html>
